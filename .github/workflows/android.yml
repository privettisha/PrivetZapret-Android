name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1'
          for attempt in 1 2 3; do
            if sdkmanager 'ndk;27.2.12479018'; then exit 0; fi
            rm -rf "$ANDROID_HOME/ndk/27.2.12479018"
            sleep 5
          done
          exit 1
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/privetzapret.jks"
          fi
      - name: Signed beta APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/privetzapret.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f "$SIGNING_KEYSTORE" ]; then
            ./gradlew :app:assembleRelease --no-daemon --console=plain
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PrivetZapret-Android
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/privetzapret.jks"
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: VPN smoke test from a separate application UID
        timeout-minutes: 12
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: '2'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            python3 scripts/udp_echo.py &
            echo $! > "$RUNNER_TEMP/privetzapret-udp-echo.pid"
            trap 'kill "$(cat "$RUNNER_TEMP/privetzapret-udp-echo.pid")" 2>/dev/null || true' EXIT
            ./gradlew :app:installDebug :probe:connectedDebugAndroidTest --no-daemon --console=plain
            adb pull /sdcard/Download/privetzapret screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PrivetZapret-Android-Emulator
          path: |
            probe/build/reports/androidTests/
            screenshots/
          if-no-files-found: warn
